name: pre-commit

"on":
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Poetry
        run: python -m pip install poetry==2.5.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pre-commit
          key:
            pre-commit-${{ runner.os }}-3.15-${{ hashFiles('.pre-commit-config.yaml',
            'poetry.lock') }}
      - run: poetry sync --no-interaction
      - run: poetry run pre-commit run --all-files --show-diff-on-failure
