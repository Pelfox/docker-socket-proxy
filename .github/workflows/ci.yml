name: Build, Test & Deploy

"on":
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      pytest_addopts:
        description: Extra options for pytest; use -vv for full details
        required: false
        type: string

permissions:
  contents: read

env:
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  PYTEST_ADDOPTS: ${{ inputs.pytest_addopts }}

jobs:
  build-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Poetry
        run: python -m pip install poetry==2.5.1
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pypoetry
          key:
            poetry-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('poetry.lock') }}
      - run: poetry sync --no-interaction
      - run: poetry run pytest --prebuild

  build-push:
    needs: build-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Login to GitHub Container Registry
        if: >-
          github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' ||
          startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker image metadata
        id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=sha
      - name: Build and publish to GHCR
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: |
            linux/386
            linux/amd64
            linux/arm/v6
            linux/arm/v7
            linux/arm64
            linux/ppc64le
            linux/s390x
          push: >-
            ${{ github.event_name != 'pull_request' && (github.ref ==
            'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}
